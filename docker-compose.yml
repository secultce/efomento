services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: 1001
        GID: 1001
    container_name: efomento-app
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - efomento

  vite:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: 1001
        GID: 1001
    container_name: efomento-vite
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
    command: ["sh", "-c", "cd /var/www && npm install && npm run dev"]
    networks:
      - efomento

  nginx:
    image: nginx:alpine
    container_name: efomento-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - efomento

  postgres:
    image: postgres:16
    container_name: efomento-postgres
    environment:
      POSTGRES_DB: efomento
      POSTGRES_USER: efomento
      POSTGRES_PASSWORD: efomento
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - efomento
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efomento -d efomento"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  efomento:
    driver: bridge

volumes:
  postgres_data:
    driver: local
