name: Codecov

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.4"
          coverage: pcov

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist

      - name: Rodar testes com cobertura
        run: ./vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Importar chave GPG do Codecov
        run: |
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 ||
          gpg --keyserver hkps://keys.openpgp.org --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 ||
          curl -fsSL https://keybase.io/codecovsecurity/pgp_keys.asc | gpg --import

      - name: Enviar relatório ao Codecov
        uses: codecov/codecov-action@v5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
